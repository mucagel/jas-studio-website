<!DOCTYPE html>

<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>body{margin:0;background:#e9e7e3;font-family:'Archivo',system-ui,sans-serif}a{color:#0a0a0a}a:hover{opacity:.7}</style>
</helmet>
<div style="display:flex;gap:64px;align-items:flex-start;flex-wrap:wrap;padding:64px">
  <div id="mobile" style="display:flex;flex-direction:column;gap:16px">
    <span style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#4a4845">Mobile · 390 × 844</span>
    <div style="width:390px;height:844px;padding:12px;background:#0a0a0a;border-radius:56px;box-shadow:0 30px 80px rgba(0,0,0,.25)">
      <iframe src="Jas Studio.dc.html" title="Mobile preview" style="width:390px;height:844px;border:0;border-radius:44px;display:block;background:#0a0a0a"></iframe>
    </div>
  </div>
  <div id="desktop" style="display:flex;flex-direction:column;gap:16px">
    <span style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#4a4845">Desktop · 1440 × 900</span>
    <div style="width:1440px;height:900px;background:#0a0a0a;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden">
      <iframe src="Jas Studio.dc.html" title="Desktop preview" style="width:1440px;height:900px;border:0;display:block"></iframe>
    </div>
  </div>
</div>
</x-dc>
